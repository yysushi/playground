<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>SSE Structured Log Viewer with Fuzzy Filter</title>
    <style>
    body {
      font-family: Arial, sans-serif;
    }
    #filterBox {
      width: 100%;
      margin-bottom: 10px;
    }
    #logList {
      max-height: 500px;
      overflow-y: scroll;
      border: 1px solid #ccc;
    }
    .log-line {
      border-bottom: 1px solid #eee;
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      gap: 8px;
    }
    .level-ERROR {
      color: red;
    }
    .level-WARN {
      color: orange;
    }
    .level-INFO {
      color: inherit;
    }
    </style>
  </head>
  <body>
    <h3>Structured Real-Time Logs</h3>
    <input id="filterBox" placeholder="Fuzzy filter logs…">

    <div id="logList"></div>

    <!-- Fuse.js from CDN (UMD build) -->
    <script
      src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.basic.min.js"
    ></script>
    <script>
    const logListEl = document.getElementById("logList");
    const filterBox = document.getElementById("filterBox");
    const logs = [];

    let fuse = new Fuse(logs, {
      keys: ["random", "msg", "level", "time"],
      threshold: 0.4,
    });

    function renderLogLines(list) {
      logListEl.innerHTML = "";
      list.forEach((item) => {
        const div = document.createElement("div");
        div.className = `log-line level-${item.level}`;
        div.innerHTML = `
            <div>${item.time}</div>
            <div>${item.level}</div>
            <div>${item.msg}</div>
            <div>${item.random}</div>
          `;
        logListEl.appendChild(div);
      });
    }

    const evtSource = new EventSource("/logs/stream");
    evtSource.onopen = () => console.log("SSE connected");
    evtSource.onmessage = (e) => {
      try {
        const obj = JSON.parse(e.data);
        logs.push(obj);
        fuse.setCollection(logs);

        const q = filterBox.value.trim();
        const out = q ? fuse.search(q).map((r) => r.item) : logs;
        renderLogLines(out);
      } catch (err) {
        console.error("JSON parse error:", err);
      }
    };
    evtSource.onerror = (err) => console.error("SSE error:", err);

    filterBox.addEventListener("input", () => {
      const q = filterBox.value.trim();
      const out = q ? fuse.search(q).map((r) => r.item) : logs;
      renderLogLines(out);
    });
    </script>
  </body>
</html>
